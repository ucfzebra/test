<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="75%">
      <stop offset="0%" stop-color="#23272e"/><stop offset="100%" stop-color="#0d0f12"/>
    </radialGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#b9c0c9"/><stop offset="30%" stop-color="#8e96a1"/>
      <stop offset="55%" stop-color="#c8cfd8"/><stop offset="80%" stop-color="#9aa2ad"/><stop offset="100%" stop-color="#7d8693"/>
    </linearGradient>
    <radialGradient id="standoff" cx="35%" cy="35%" r="80%">
      <stop offset="0%" stop-color="#d7dde4"/><stop offset="100%" stop-color="#6c7480"/>
    </radialGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bg)"/>
  <!-- wall -->
  <rect x="0" y="0" width="800" height="600" fill="#191d23" opacity=".6"/>
  <!-- sign -->
  <g transform="translate(400 290)">
    <rect x="-272" y="-148" width="544" height="296" rx="6" fill="#0a0c0f" opacity=".6" transform="translate(10 12)"/>
    <rect x="-272" y="-148" width="544" height="296" rx="6" fill="url(#steel)"/>
    <!-- brushed texture -->
    <g stroke="#ffffff" stroke-width="1" opacity=".12">
      <line x1="-272" y1="-110" x2="272" y2="-110"/><line x1="-272" y1="-70" x2="272" y2="-70"/>
      <line x1="-272" y1="-30" x2="272" y2="-30"/><line x1="-272" y1="10" x2="272" y2="10"/>
      <line x1="-272" y1="50" x2="272" y2="50"/><line x1="-272" y1="90" x2="272" y2="90"/><line x1="-272" y1="124" x2="272" y2="124"/>
    </g>
    <!-- standoffs -->
    <circle cx="-244" cy="-120" r="13" fill="url(#standoff)"/><circle cx="244" cy="-120" r="13" fill="url(#standoff)"/>
    <circle cx="-244" cy="120" r="13" fill="url(#standoff)"/><circle cx="244" cy="120" r="13" fill="url(#standoff)"/>
    <!-- fiber-marked artwork -->
    <g fill="none" stroke="#15181d">
      <polygon points="-150,-52 -108,-28 -108,20 -150,44 -192,20 -192,-28" stroke-width="6"/>
      <path d="M-171 32 V-16 l21 24 21-24 V32" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <g fill="#15181d" font-family="Arial">
      <text x="-66" y="-12" font-size="44" font-weight="bold" letter-spacing="3">MONTEGO</text>
      <text x="-66" y="36" font-size="44" font-weight="bold" letter-spacing="3">CUSTOMS</text>
      <text x="-66" y="72" font-size="15" letter-spacing="6" fill="#3c434d">PRECISION LASER ENGRAVING</text>
    </g>
  </g>
  <text x="400" y="560" text-anchor="middle" fill="#5a6270" font-family="Arial" font-size="14" letter-spacing="4">BRUSHED STEEL OFFICE SIGN</text>
</svg>
