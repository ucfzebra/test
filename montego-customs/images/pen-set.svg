<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="75%">
      <stop offset="0%" stop-color="#23272e"/><stop offset="100%" stop-color="#0d0f12"/>
    </radialGradient>
    <linearGradient id="case" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4a3320"/><stop offset="100%" stop-color="#33220f"/>
    </linearGradient>
    <linearGradient id="rosewood" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7a3b22"/><stop offset="50%" stop-color="#94492a"/><stop offset="100%" stop-color="#5f2c18"/>
    </linearGradient>
    <linearGradient id="brass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e9c97a"/><stop offset="50%" stop-color="#b58b3e"/><stop offset="100%" stop-color="#8a6526"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bg)"/>
  <ellipse cx="400" cy="478" rx="300" ry="34" fill="#000" opacity=".45"/>
  <!-- open lid -->
  <g transform="translate(400 200)">
    <rect x="-250" y="-70" width="500" height="120" rx="10" fill="url(#case)"/>
    <rect x="-238" y="-58" width="476" height="96" rx="7" fill="#241708"/>
    <g stroke="#e8842c" fill="none" opacity=".9">
      <polygon points="0,-42 26,-27 26,3 0,18 -26,3 -26,-27" stroke-width="3"/>
      <path d="M-13 8 V-15 l13 14 13-14 V8" stroke="#f3c08c" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <text x="0" y="38" text-anchor="middle" fill="#a4805a" font-family="Arial" font-size="12" letter-spacing="5">MONTEGO CUSTOMS</text>
  </g>
  <!-- case base with flocked bed -->
  <g transform="translate(400 360)">
    <rect x="-250" y="-60" width="500" height="130" rx="10" fill="url(#case)"/>
    <rect x="-238" y="-48" width="476" height="106" rx="7" fill="#1c2128"/>
    <path d="M-238 -10 q120 22 238 0 q120 -22 238 0 v20 q-118 22 -238 0 q-118 -22 -238 0 z" fill="#151a20"/>
    <!-- pen -->
    <g transform="rotate(-4)">
      <rect x="-190" y="-12" width="150" height="22" rx="11" fill="url(#rosewood)"/>
      <rect x="-44" y="-12" width="26" height="22" fill="url(#brass)"/>
      <rect x="-18" y="-10" width="150" height="18" rx="9" fill="url(#rosewood)"/>
      <path d="M132 -8 L172 0 L132 9 Z" fill="url(#brass)"/>
      <rect x="-176" y="-22" width="10" height="24" rx="4" fill="url(#brass)"/>
      <text x="30" y="5" text-anchor="middle" fill="#f3c08c" font-family="Georgia" font-size="12" font-style="italic" letter-spacing="2">J. T. Reynolds</text>
    </g>
  </g>
  <text x="400" y="560" text-anchor="middle" fill="#5a6270" font-family="Arial" font-size="14" letter-spacing="4">EXECUTIVE PEN &amp; CASE SET</text>
</svg>
