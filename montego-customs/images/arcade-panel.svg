<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="75%">
      <stop offset="0%" stop-color="#23272e"/><stop offset="100%" stop-color="#0d0f12"/>
    </radialGradient>
    <linearGradient id="ebon" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#221f1d"/><stop offset="100%" stop-color="#120f0e"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bg)"/>
  <g transform="translate(400 285)">
    <rect x="-250" y="-195" width="500" height="390" rx="10" fill="#0a0c0f" opacity=".55" transform="translate(9 11)"/>
    <rect x="-250" y="-195" width="500" height="390" rx="10" fill="url(#ebon)"/>
    <rect x="-236" y="-181" width="472" height="362" rx="6" fill="none" stroke="#3a3431" stroke-width="2"/>
    <!-- HI-SCORE header -->
    <g font-family="monospace" text-anchor="middle">
      <text y="-138" font-size="26" fill="#e8842c" letter-spacing="6">HI-SCORE</text>
      <text y="-104" font-size="30" fill="#f3c08c" letter-spacing="8">AAA · 999990</text>
    </g>
    <!-- invader formation (pixel blocks) -->
    <g fill="#e8842c">
      <!-- invader builder: each is 11x8 grid of 6px cells, simplified shape -->
      <g transform="translate(-160 -60)">
        <rect x="6" y="0" width="6" height="6"/><rect x="30" y="0" width="6" height="6"/>
        <rect x="12" y="6" width="6" height="6"/><rect x="24" y="6" width="6" height="6"/>
        <rect x="6" y="12" width="30" height="6"/>
        <rect x="0" y="18" width="12" height="6"/><rect x="18" y="18" width="6" height="6"/><rect x="30" y="18" width="12" height="6"/>
        <rect x="0" y="24" width="42" height="6"/>
        <rect x="0" y="30" width="6" height="6"/><rect x="36" y="30" width="6" height="6"/>
        <rect x="12" y="36" width="6" height="6"/><rect x="24" y="36" width="6" height="6"/>
      </g>
      <g transform="translate(-21 -60)">
        <rect x="6" y="0" width="6" height="6"/><rect x="30" y="0" width="6" height="6"/>
        <rect x="12" y="6" width="6" height="6"/><rect x="24" y="6" width="6" height="6"/>
        <rect x="6" y="12" width="30" height="6"/>
        <rect x="0" y="18" width="12" height="6"/><rect x="18" y="18" width="6" height="6"/><rect x="30" y="18" width="12" height="6"/>
        <rect x="0" y="24" width="42" height="6"/>
        <rect x="0" y="30" width="6" height="6"/><rect x="36" y="30" width="6" height="6"/>
        <rect x="12" y="36" width="6" height="6"/><rect x="24" y="36" width="6" height="6"/>
      </g>
      <g transform="translate(118 -60)">
        <rect x="6" y="0" width="6" height="6"/><rect x="30" y="0" width="6" height="6"/>
        <rect x="12" y="6" width="6" height="6"/><rect x="24" y="6" width="6" height="6"/>
        <rect x="6" y="12" width="30" height="6"/>
        <rect x="0" y="18" width="12" height="6"/><rect x="18" y="18" width="6" height="6"/><rect x="30" y="18" width="12" height="6"/>
        <rect x="0" y="24" width="42" height="6"/>
        <rect x="0" y="30" width="6" height="6"/><rect x="36" y="30" width="6" height="6"/>
        <rect x="12" y="36" width="6" height="6"/><rect x="24" y="36" width="6" height="6"/>
      </g>
    </g>
    <!-- defender ship -->
    <g fill="#d9b98c" transform="translate(-21 36)">
      <rect x="18" y="0" width="6" height="6"/>
      <rect x="12" y="6" width="18" height="6"/>
      <rect x="0" y="12" width="42" height="6"/>
      <rect x="0" y="18" width="42" height="6"/>
    </g>
    <rect x="-2" y="6" width="4" height="20" fill="#f3c08c"/>
    <!-- joystick + buttons -->
    <g transform="translate(0 128)">
      <rect x="-150" y="-4" width="300" height="46" rx="10" fill="#181512" stroke="#3a3431" stroke-width="2"/>
      <circle cx="-92" cy="-18" r="20" fill="#e8842c"/>
      <rect x="-98" y="-14" width="12" height="36" rx="5" fill="#39322c"/>
      <circle cx="34" cy="18" r="14" fill="none" stroke="#e8842c" stroke-width="4"/>
      <circle cx="86" cy="18" r="14" fill="none" stroke="#d9b98c" stroke-width="4"/>
      <text x="-20" y="24" text-anchor="middle" font-family="monospace" font-size="12" fill="#8a8076">P1</text>
    </g>
    <text y="180" text-anchor="middle" font-family="monospace" font-size="14" fill="#8a8076" letter-spacing="4">INSERT COIN</text>
  </g>
  <text x="400" y="570" text-anchor="middle" fill="#5a6270" font-family="Arial" font-size="14" letter-spacing="4">8-BIT ARCADE WALL PANEL</text>
</svg>
