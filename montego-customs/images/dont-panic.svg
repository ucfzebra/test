<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="75%">
      <stop offset="0%" stop-color="#23272e"/><stop offset="100%" stop-color="#0d0f12"/>
    </radialGradient>
    <linearGradient id="ebon" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#262220"/><stop offset="100%" stop-color="#141110"/>
    </linearGradient>
    <linearGradient id="walnut" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6b4a2e"/><stop offset="100%" stop-color="#46301c"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bg)"/>
  <ellipse cx="400" cy="475" rx="270" ry="30" fill="#000" opacity=".45"/>
  <!-- desk sign panel -->
  <g transform="translate(400 280)">
    <rect x="-235" y="-140" width="470" height="280" rx="14" fill="#0a0c0f" opacity=".55" transform="translate(8 10)"/>
    <rect x="-235" y="-140" width="470" height="280" rx="14" fill="url(#ebon)"/>
    <rect x="-223" y="-128" width="446" height="256" rx="10" fill="none" stroke="#3a3431" stroke-width="2"/>
    <!-- big friendly letters -->
    <g text-anchor="middle" font-family="Arial" font-weight="bold">
      <text y="-30" font-size="74" fill="#e8842c" letter-spacing="4">DON'T</text>
      <text y="62" font-size="74" fill="#e8842c" letter-spacing="4">PANIC</text>
    </g>
    <text y="104" text-anchor="middle" fill="#8a8076" font-family="Georgia" font-style="italic" font-size="16">in large, friendly letters</text>
    <!-- tiny green planet doodle -->
    <g transform="translate(190 -100)" stroke="#6f9b6a" stroke-width="2.5" fill="none">
      <circle r="14"/><path d="M-9 -3 q9 8 18 0" stroke-linecap="round"/>
      <circle cx="-5" cy="-4" r="1.6" fill="#6f9b6a" stroke="none"/><circle cx="5" cy="-4" r="1.6" fill="#6f9b6a" stroke="none"/>
    </g>
  </g>
  <!-- walnut base with 42 -->
  <g transform="translate(400 438)">
    <rect x="-260" y="-18" width="520" height="42" rx="8" fill="url(#walnut)"/>
    <text y="12" text-anchor="middle" fill="#f3c08c" font-family="Arial" font-weight="bold" font-size="22" letter-spacing="10">· 42 ·</text>
    <text x="-200" y="11" fill="#8a6f4e" font-family="Georgia" font-style="italic" font-size="13">mostly</text>
    <text x="166" y="11" fill="#8a6f4e" font-family="Georgia" font-style="italic" font-size="13">harmless</text>
  </g>
  <text x="400" y="565" text-anchor="middle" fill="#5a6270" font-family="Arial" font-size="14" letter-spacing="4">DON'T PANIC DESK SIGN</text>
</svg>
