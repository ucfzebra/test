    <path d="M-180 52 h360" stroke="#4a3017" stroke-width="2"/>
  </g>
  <text x="400" y="565" text-anchor="middle" fill="#5a6270" font-family="Arial" font-size="14" letter-spacing="4">INTERPLANETARY DELIVERY CREW PLAQUE</text>
