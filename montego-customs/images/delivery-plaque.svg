        <path d="M-60 -148 l10 0 M-55 -153 l0 10"/>
        <path d="M198 -150 l10 0 M203 -155 l0 10"/>
        <path d="M-150 -10 l10 0 M-145 -15 l0 10"/>
      </g>
      <!-- rocket -->
      <g transform="translate(-80 -52) rotate(-24)">
        <path d="M-70 0 Q-40 -34 30 -34 Q72 -34 86 0 Q72 34 30 34 Q-40 34 -70 0 Z" stroke-width="5"/>
        <circle cx="34" cy="0" r="13"/>
        <path d="M-46 -22 L-78 -44 L-64 -8 M-46 22 L-78 44 L-64 8" stroke-width="4.5"/>
        <path d="M-72 0 h-36 M-78 -10 h-22 M-78 10 h-22" stroke-width="3.5" stroke-linecap="round"/>
      </g>
    </g>
    <!-- caption -->
    <g fill="#4a3017" text-anchor="middle">
      <text y="84" font-family="Georgia" font-style="italic" font-size="42">"Good news, everyone!"</text>
      <text y="126" font-family="Arial" font-size="15" letter-spacing="5">INTERPLANETARY DELIVERY · EST. 2999</text>
