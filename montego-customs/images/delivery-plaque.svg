<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="75%">
      <stop offset="0%" stop-color="#23272e"/><stop offset="100%" stop-color="#0d0f12"/>
    </radialGradient>
    <linearGradient id="birch" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d9b98c"/><stop offset="100%" stop-color="#b8915f"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bg)"/>
  <!-- ebonized frame -->
  <g transform="translate(400 285)">
    <rect x="-258" y="-198" width="516" height="396" rx="10" fill="#0a0c0f" opacity=".55" transform="translate(9 11)"/>
    <rect x="-258" y="-198" width="516" height="396" rx="10" fill="#17120c"/>
    <rect x="-232" y="-172" width="464" height="344" rx="6" fill="url(#birch)"/>
    <g stroke="#a9854f" stroke-width="1.4" opacity=".5" fill="none">
      <path d="M-232 -100 Q0 -108 232 -98"/><path d="M-232 20 Q0 12 232 22"/><path d="M-232 120 Q0 112 232 122"/>
    </g>
    <!-- engraved retro-futurist scene -->
    <g stroke="#4a3017" fill="none" stroke-width="4">
      <!-- planet with ring -->
      <circle cx="120" cy="-62" r="52"/>
      <ellipse cx="120" cy="-62" rx="92" ry="24" transform="rotate(-18 120 -62)"/>
      <path d="M92 -84 q22 -14 50 -6 M86 -56 q30 14 64 2" stroke-width="2.5"/>
      <!-- stars -->
      <g stroke-width="2.5" stroke-linecap="round">
