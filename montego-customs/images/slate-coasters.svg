<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="75%">
      <stop offset="0%" stop-color="#23272e"/><stop offset="100%" stop-color="#0d0f12"/>
    </radialGradient>
    <radialGradient id="slate" cx="40%" cy="35%" r="80%">
      <stop offset="0%" stop-color="#454c56"/><stop offset="100%" stop-color="#2b3038"/>
    </radialGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bg)"/>
  <ellipse cx="400" cy="485" rx="300" ry="34" fill="#000" opacity=".45"/>
  <!-- stacked coasters behind -->
  <g transform="translate(545 430)">
    <ellipse cx="0" cy="22" rx="120" ry="26" fill="#23272d"/>
    <ellipse cx="0" cy="12" rx="120" ry="26" fill="#2e343c"/>
    <ellipse cx="0" cy="2" rx="120" ry="26" fill="#262b32"/>
    <ellipse cx="0" cy="-8" rx="120" ry="26" fill="#333a43"/>
    <ellipse cx="0" cy="-14" rx="118" ry="24" fill="#3b424c"/>
  </g>
  <!-- front coaster, face on -->
  <g transform="translate(300 300)">
    <circle r="185" fill="url(#slate)"/>
    <path d="M-185 0 A185 185 0 0 1 185 0" fill="none" stroke="#525a66" stroke-width="3" opacity=".5"/>
    <!-- chipped natural edge -->
    <path d="M-183 -28 l-6 10 8 9 M180 40 l8 -6 -5 -12 M-60 -176 l4 -8 12 5" stroke="#1d2127" stroke-width="5" fill="none" opacity=".7"/>
    <!-- frost etched logo -->
    <g opacity=".95">
      <circle r="118" fill="none" stroke="#cfd6df" stroke-width="2.5" stroke-dasharray="3 7"/>
      <polygon points="0,-78 66,-39 66,39 0,78 -66,39 -66,-39" stroke="#e6ebf2" stroke-width="4" fill="none"/>
      <path d="M-32 30 V-24 l32 36 32-36 V30" stroke="#eef2f7" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <text y="104" text-anchor="middle" fill="#cfd6df" font-family="Arial" font-size="17" letter-spacing="6">YOUR LOGO HERE</text>
    </g>
  </g>
  <text x="400" y="565" text-anchor="middle" fill="#5a6270" font-family="Arial" font-size="14" letter-spacing="4">SLATE LOGO COASTER SET · 6</text>
</svg>
