<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="75%">
      <stop offset="0%" stop-color="#23272e"/><stop offset="100%" stop-color="#0d0f12"/>
    </radialGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#aebccb" stop-opacity=".34"/>
      <stop offset="45%" stop-color="#dfe9f2" stop-opacity=".16"/>
      <stop offset="100%" stop-color="#8a99aa" stop-opacity=".30"/>
    </linearGradient>
    <linearGradient id="fizz" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f2d490" stop-opacity=".85"/><stop offset="100%" stop-color="#caa050" stop-opacity=".7"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bg)"/>
  <ellipse cx="400" cy="505" rx="320" ry="26" fill="#000" opacity=".45"/>
  <!-- four visible flutes of the set -->
  <g>
    <!-- flute template repeated -->
    <g transform="translate(190 0)">
      <path d="M-34 130 q0 130 26 158 l0 130 q-30 8 -36 18 l88 0 q-6 -10 -36 -18 l0 -130 q26 -28 26 -158 z" fill="url(#glass)" stroke="#c6d2de" stroke-width="2" opacity=".95"/>
      <path d="M-28 150 q0 105 22 132 q22 -27 22 -132 z" fill="url(#fizz)" opacity=".5"/>
      <circle cx="-8" cy="190" r="2.4" fill="#f6e3b0"/><circle cx="6" cy="225" r="2" fill="#f6e3b0"/><circle cx="-2" cy="260" r="2.2" fill="#f6e3b0"/>
      <text x="-6" y="350" text-anchor="middle" fill="#e9f1f8" font-family="Georgia" font-style="italic" font-size="19">Bride</text>
    </g>
    <g transform="translate(330 14)">
      <path d="M-34 130 q0 130 26 158 l0 130 q-30 8 -36 18 l88 0 q-6 -10 -36 -18 l0 -130 q26 -28 26 -158 z" fill="url(#glass)" stroke="#c6d2de" stroke-width="2" opacity=".95"/>
      <path d="M-28 150 q0 105 22 132 q22 -27 22 -132 z" fill="url(#fizz)" opacity=".5"/>
      <circle cx="-6" cy="200" r="2.2" fill="#f6e3b0"/><circle cx="4" cy="240" r="2" fill="#f6e3b0"/>
      <text x="-6" y="348" text-anchor="middle" fill="#e9f1f8" font-family="Georgia" font-style="italic" font-size="14">Maid of Honor</text>
    </g>
    <g transform="translate(470 14)">
      <path d="M-34 130 q0 130 26 158 l0 130 q-30 8 -36 18 l88 0 q-6 -10 -36 -18 l0 -130 q26 -28 26 -158 z" fill="url(#glass)" stroke="#c6d2de" stroke-width="2" opacity=".95"/>
      <path d="M-28 150 q0 105 22 132 q22 -27 22 -132 z" fill="url(#fizz)" opacity=".5"/>
      <circle cx="-4" cy="210" r="2.2" fill="#f6e3b0"/><circle cx="6" cy="252" r="2" fill="#f6e3b0"/>
      <text x="-6" y="348" text-anchor="middle" fill="#e9f1f8" font-family="Georgia" font-style="italic" font-size="17">Riley</text>
    </g>
    <g transform="translate(610 0)">
      <path d="M-34 130 q0 130 26 158 l0 130 q-30 8 -36 18 l88 0 q-6 -10 -36 -18 l0 -130 q26 -28 26 -158 z" fill="url(#glass)" stroke="#c6d2de" stroke-width="2" opacity=".95"/>
      <path d="M-28 150 q0 105 22 132 q22 -27 22 -132 z" fill="url(#fizz)" opacity=".5"/>
      <circle cx="-8" cy="195" r="2.2" fill="#f6e3b0"/><circle cx="2" cy="235" r="2.4" fill="#f6e3b0"/>
      <text x="-6" y="350" text-anchor="middle" fill="#e9f1f8" font-family="Georgia" font-style="italic" font-size="17">Jordan</text>
    </g>
  </g>
  <text x="400" y="80" text-anchor="middle" fill="#e8842c" font-family="Georgia" font-style="italic" font-size="26">the last toast before the ring</text>
  <text x="400" y="565" text-anchor="middle" fill="#5a6270" font-family="Arial" font-size="14" letter-spacing="4">BACHELORETTE FLUTE SET · 8</text>
</svg>
