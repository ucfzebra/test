<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="75%">
      <stop offset="0%" stop-color="#23272e"/><stop offset="100%" stop-color="#0d0f12"/>
    </radialGradient>
    <linearGradient id="hide" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4a3324"/><stop offset="55%" stop-color="#3a2719"/>
      <stop offset="100%" stop-color="#2b1c10"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bg)"/>
  <ellipse cx="400" cy="498" rx="250" ry="26" fill="#000" opacity=".45"/>
  <g transform="translate(400 290) rotate(-4)">
    <!-- page block -->
    <rect x="-158" y="-202" width="330" height="412" rx="8" fill="#cdbfa4"/>
    <g stroke="#b3a384" stroke-width="2"><line x1="166" y1="-196" x2="166" y2="204"/><line x1="170" y1="-192" x2="170" y2="206"/></g>
    <!-- cover -->
    <rect x="-178" y="-212" width="340" height="416" rx="10" fill="#0a0c0f" opacity=".55" transform="translate(8 10)"/>
    <rect x="-178" y="-212" width="340" height="416" rx="10" fill="url(#hide)"/>
    <rect x="-164" y="-198" width="312" height="388" rx="7" fill="none" stroke="#1f1409" stroke-width="2.5" opacity=".8"/>
    <!-- elastic band -->
    <rect x="118" y="-212" width="14" height="416" fill="#15110c"/>
    <!-- engraved sigil circle -->
    <g transform="translate(-8 -34)" stroke="#d9a55e" fill="none">
      <circle r="104" stroke-width="3"/>
      <circle r="88" stroke-width="1.6" stroke-dasharray="4 8"/>
      <polygon points="0,-76 66,38 -66,38" stroke-width="2.6"/>
      <polygon points="0,76 66,-38 -66,-38" stroke-width="2.6"/>
      <circle r="26" stroke-width="2.6"/>
      <circle r="4" fill="#d9a55e" stroke="none"/>
      <!-- rune ticks around circle -->
      <g stroke-width="2">
        <line x1="0" y1="-104" x2="0" y2="-93"/><line x1="0" y1="104" x2="0" y2="93"/>
        <line x1="-104" y1="0" x2="-93" y2="0"/><line x1="104" y1="0" x2="93" y2="0"/>
        <line x1="-74" y1="-74" x2="-66" y2="-66"/><line x1="74" y1="-74" x2="66" y2="-66"/>
        <line x1="-74" y1="74" x2="-66" y2="66"/><line x1="74" y1="74" x2="66" y2="66"/>
      </g>
    </g>
    <!-- runic name band -->
    <g text-anchor="middle" fill="#d9a55e" font-family="Georgia">
      <text x="-8" y="118" font-size="14" letter-spacing="8" opacity=".85">ᛗ ᚨ ᚱ ᚲ ᚢ ᛋ</text>
      <text x="-8" y="156" font-style="italic" font-size="22">Grimoire of Marcus</text>
    </g>
  </g>
  <text x="400" y="565" text-anchor="middle" fill="#5a6270" font-family="Arial" font-size="14" letter-spacing="4">ARCANE SPELLBOOK JOURNAL</text>
</svg>
