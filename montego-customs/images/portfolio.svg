<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="75%">
      <stop offset="0%" stop-color="#23272e"/><stop offset="100%" stop-color="#0d0f12"/>
    </radialGradient>
    <linearGradient id="leather" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2e2c2a"/><stop offset="55%" stop-color="#1d1c1b"/><stop offset="100%" stop-color="#262422"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bg)"/>
  <ellipse cx="400" cy="500" rx="260" ry="28" fill="#000" opacity=".45"/>
  <!-- portfolio cover, slight perspective -->
  <g transform="translate(400 295) rotate(-3)">
    <rect x="-185" y="-215" width="370" height="430" rx="14" fill="#0a0c0f" opacity=".6" transform="translate(10 12)"/>
    <rect x="-185" y="-215" width="370" height="430" rx="14" fill="url(#leather)"/>
    <!-- stitching -->
    <rect x="-171" y="-201" width="342" height="402" rx="10" fill="none" stroke="#8a7355" stroke-width="2" stroke-dasharray="7 6" opacity=".8"/>
    <!-- grain speckle -->
    <g fill="#3a3835" opacity=".5">
      <circle cx="-120" cy="-130" r="2"/><circle cx="60" cy="-160" r="2"/><circle cx="130" cy="-60" r="2"/>
      <circle cx="-80" cy="40" r="2"/><circle cx="100" cy="120" r="2"/><circle cx="-130" cy="150" r="2"/>
      <circle cx="20" cy="-40" r="2"/><circle cx="-30" cy="170" r="2"/><circle cx="150" cy="30" r="2"/>
    </g>
    <!-- debossed logo -->
    <g opacity=".95">
      <polygon points="0,-58 46,-32 46,20 0,46 -46,20 -46,-32" stroke="#0c0d0f" stroke-width="5" fill="none"/>
      <polygon points="0,-58 46,-32 46,20 0,46 -46,20 -46,-32" stroke="#4d4639" stroke-width="1.5" fill="none" transform="translate(1.5 1.5)"/>
      <path d="M-23 36 V-18 l23 26 23-26 V36" stroke="#0c0d0f" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <text y="92" text-anchor="middle" fill="#0c0d0f" font-family="Arial" font-size="16" font-weight="bold" letter-spacing="6">MONTEGO CUSTOMS</text>
      <text y="93.5" x="1" text-anchor="middle" fill="#4d4639" font-family="Arial" font-size="16" font-weight="bold" letter-spacing="6" opacity=".5">MONTEGO CUSTOMS</text>
    </g>
    <!-- pen loop hint -->
    <rect x="150" y="-30" width="18" height="80" rx="9" fill="#161514" stroke="#2e2c2a" stroke-width="2"/>
  </g>
  <text x="400" y="565" text-anchor="middle" fill="#5a6270" font-family="Arial" font-size="14" letter-spacing="4">BRANDED LEATHERETTE PORTFOLIO</text>
</svg>
