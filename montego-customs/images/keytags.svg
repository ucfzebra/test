<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="75%">
      <stop offset="0%" stop-color="#23272e"/><stop offset="100%" stop-color="#0d0f12"/>
    </radialGradient>
    <linearGradient id="oak" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c89a62"/><stop offset="100%" stop-color="#a87c46"/>
    </linearGradient>
    <radialGradient id="ring" cx="35%" cy="35%" r="80%">
      <stop offset="0%" stop-color="#d7dde4"/><stop offset="100%" stop-color="#79828e"/>
    </radialGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bg)"/>
  <ellipse cx="400" cy="500" rx="310" ry="28" fill="#000" opacity=".45"/>
  <!-- scattered tags behind -->
  <g opacity=".85">
    <g transform="translate(180 190) rotate(-18)">
      <rect x="-78" y="-44" width="156" height="88" rx="14" fill="url(#oak)"/>
      <circle cx="-58" cy="-22" r="9" fill="#15181d"/>
      <text x="8" y="-4" text-anchor="middle" fill="#5a3c1b" font-family="Arial" font-weight="bold" font-size="20">EAST HIGH</text>
      <text x="8" y="22" text-anchor="middle" fill="#5a3c1b" font-family="Arial" font-size="14">CLASS OF '06</text>
    </g>
    <g transform="translate(620 200) rotate(14)">
      <rect x="-78" y="-44" width="156" height="88" rx="14" fill="url(#oak)"/>
      <circle cx="-58" cy="-22" r="9" fill="#15181d"/>
      <text x="8" y="-4" text-anchor="middle" fill="#5a3c1b" font-family="Arial" font-weight="bold" font-size="20">EAST HIGH</text>
      <text x="8" y="22" text-anchor="middle" fill="#5a3c1b" font-family="Arial" font-size="14">CLASS OF '06</text>
    </g>
    <g transform="translate(225 420) rotate(9)">
      <rect x="-78" y="-44" width="156" height="88" rx="14" fill="url(#oak)"/>
      <circle cx="-58" cy="-22" r="9" fill="#15181d"/>
      <text x="8" y="2" text-anchor="middle" fill="#5a3c1b" font-family="Georgia" font-style="italic" font-size="22">Sam P.</text>
    </g>
    <g transform="translate(590 430) rotate(-10)">
      <rect x="-78" y="-44" width="156" height="88" rx="14" fill="url(#oak)"/>
      <circle cx="-58" cy="-22" r="9" fill="#15181d"/>
      <text x="8" y="2" text-anchor="middle" fill="#5a3c1b" font-family="Georgia" font-style="italic" font-size="22">Dana W.</text>
    </g>
  </g>
  <!-- hero tag with ring -->
  <g transform="translate(400 300) rotate(-4)">
    <rect x="-120" y="-70" width="240" height="140" rx="20" fill="#0a0c0f" opacity=".55" transform="translate(7 9)"/>
    <rect x="-120" y="-70" width="240" height="140" rx="20" fill="url(#oak)"/>
    <circle cx="-92" cy="-38" r="13" fill="#15181d"/>
    <circle cx="-104" cy="-52" r="22" fill="none" stroke="url(#ring)" stroke-width="7"/>
    <!-- crest -->
    <g stroke="#5a3c1b" fill="none" stroke-width="3">
      <path d="M-58 -26 l22 -12 22 12 v22 q0 16 -22 24 q-22 -8 -22 -24 z"/>
      <path d="M-50 -16 h28 M-50 -4 h28" stroke-width="2.5"/>
    </g>
    <g fill="#5a3c1b" font-family="Arial" text-anchor="start">
      <text x="2" y="-14" font-weight="bold" font-size="26">EAST HIGH</text>
      <text x="2" y="14" font-size="17">CLASS OF '06</text>
      <text x="2" y="42" font-family="Georgia" font-style="italic" font-size="17">20-Year Reunion</text>
    </g>
  </g>
  <text x="400" y="565" text-anchor="middle" fill="#5a6270" font-family="Arial" font-size="14" letter-spacing="4">REUNION KEEPSAKE KEYTAGS · 25</text>
</svg>
