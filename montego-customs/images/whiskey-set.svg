<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="75%">
      <stop offset="0%" stop-color="#23272e"/><stop offset="100%" stop-color="#0d0f12"/>
    </radialGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#aebccb" stop-opacity=".32"/>
      <stop offset="50%" stop-color="#e6eef5" stop-opacity=".12"/>
      <stop offset="100%" stop-color="#8a99aa" stop-opacity=".30"/>
    </linearGradient>
    <linearGradient id="whiskey" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d98e2b"/><stop offset="100%" stop-color="#8e5413"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bg)"/>
  <ellipse cx="400" cy="490" rx="320" ry="30" fill="#000" opacity=".45"/>
  <!-- back pair -->
  <g opacity=".75">
    <g transform="translate(255 180) scale(.82)">
      <path d="M-70 0 L-58 220 q0 16 16 16 L42 236 q16 0 16 -16 L70 0 Z" fill="url(#glass)" stroke="#b9c6d2" stroke-width="2.5"/>
      <path d="M-56 130 L-50 208 q0 12 12 12 L38 220 q12 0 12 -12 L56 130 Z" fill="url(#whiskey)" opacity=".8"/>
      <text y="86" text-anchor="middle" fill="#dfe8f0" font-family="Georgia" font-size="40">MKD</text>
    </g>
    <g transform="translate(545 180) scale(.82)">
      <path d="M-70 0 L-58 220 q0 16 16 16 L42 236 q16 0 16 -16 L70 0 Z" fill="url(#glass)" stroke="#b9c6d2" stroke-width="2.5"/>
      <path d="M-56 130 L-50 208 q0 12 12 12 L38 220 q12 0 12 -12 L56 130 Z" fill="url(#whiskey)" opacity=".8"/>
      <text y="86" text-anchor="middle" fill="#dfe8f0" font-family="Georgia" font-size="40">ALS</text>
    </g>
  </g>
  <!-- front glass with deep etch -->
  <g transform="translate(400 230)">
    <path d="M-88 0 L-74 268 q0 18 18 18 L56 286 q18 0 18 -18 L88 0 Z" fill="url(#glass)" stroke="#c9d5e0" stroke-width="3"/>
    <path d="M-70 160 L-62 252 q0 14 14 14 L48 266 q14 0 14 -14 L70 160 Z" fill="url(#whiskey)"/>
    <!-- ice -->
    <rect x="-34" y="170" width="52" height="48" rx="9" fill="#eef5fa" opacity=".5" transform="rotate(-12 -8 194)"/>
    <rect x="2" y="196" width="46" height="42" rx="8" fill="#e2ecf4" opacity=".42" transform="rotate(9 25 217)"/>
    <!-- etched monogram -->
    <g text-anchor="middle" fill="#eaf1f7">
      <circle r="58" cy="84" fill="none" stroke="#dfe8f0" stroke-width="2.5" stroke-dasharray="2 6"/>
      <text y="102" font-family="Georgia" font-size="52">JTR</text>
      <text y="140" font-family="Georgia" font-size="13" font-style="italic" opacity=".9">best man · 10.17.26</text>
    </g>
  </g>
  <text x="400" y="565" text-anchor="middle" fill="#5a6270" font-family="Arial" font-size="14" letter-spacing="4">GROOMSMEN WHISKEY SET · 4</text>
</svg>
