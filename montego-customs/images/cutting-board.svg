<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="75%">
      <stop offset="0%" stop-color="#23272e"/><stop offset="100%" stop-color="#0d0f12"/>
    </radialGradient>
    <linearGradient id="maple" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e3c08e"/><stop offset="50%" stop-color="#d4ab72"/><stop offset="100%" stop-color="#c1975c"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bg)"/>
  <ellipse cx="400" cy="495" rx="300" ry="30" fill="#000" opacity=".45"/>
  <g transform="translate(400 295) rotate(-7)">
    <!-- board -->
    <rect x="-245" y="-175" width="490" height="350" rx="26" fill="#0a0c0f" opacity=".55" transform="translate(9 11)"/>
    <rect x="-245" y="-175" width="490" height="350" rx="26" fill="url(#maple)"/>
    <!-- handle hole -->
    <circle cx="195" cy="-125" r="22" fill="#15181d"/>
    <circle cx="195" cy="-125" r="22" fill="none" stroke="#a9854f" stroke-width="4"/>
    <!-- end-grain checker hint -->
    <g fill="#c79e63" opacity=".45">
      <rect x="-245" y="-175" width="70" height="70" rx="2"/><rect x="-105" y="-175" width="70" height="70"/>
      <rect x="35" y="-175" width="70" height="70"/><rect x="-175" y="-105" width="70" height="70"/>
      <rect x="-35" y="-105" width="70" height="70"/><rect x="105" y="-105" width="70" height="70"/>
      <rect x="-245" y="-35" width="70" height="70"/><rect x="-105" y="-35" width="70" height="70"/>
      <rect x="35" y="-35" width="70" height="70"/><rect x="175" y="-35" width="70" height="70"/>
      <rect x="-175" y="35" width="70" height="70"/><rect x="-35" y="35" width="70" height="70"/>
      <rect x="105" y="35" width="70" height="70"/><rect x="-245" y="105" width="70" height="70" rx="2"/>
      <rect x="-105" y="105" width="70" height="70"/><rect x="35" y="105" width="70" height="70"/><rect x="175" y="105" width="70" height="70"/>
    </g>
    <!-- engraving -->
    <g fill="#5a3c1b" text-anchor="middle">
      <text y="-38" font-family="Georgia" font-style="italic" font-size="52">The Montgomerys</text>
      <text y="14" font-family="Georgia" font-size="16" letter-spacing="5">ESTABLISHED</text>
      <text y="64" font-family="Georgia" font-size="40">2026</text>
    </g>
    <g stroke="#5a3c1b" stroke-width="2.5" fill="none" stroke-linecap="round">
      <path d="M-150 -86 q70 -22 150 -18 q80 -4 150 18"/>
      <path d="M-120 92 q60 18 120 14 q60 4 120 -14"/>
      <circle cx="0" cy="34" r="3" fill="#5a3c1b" stroke="none"/>
    </g>
  </g>
  <text x="400" y="565" text-anchor="middle" fill="#5a6270" font-family="Arial" font-size="14" letter-spacing="4">MR &amp; MRS END-GRAIN CUTTING BOARD</text>
