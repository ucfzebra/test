<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="75%">
      <stop offset="0%" stop-color="#23272e"/><stop offset="100%" stop-color="#0d0f12"/>
    </radialGradient>
    <linearGradient id="birch" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d9b98c"/><stop offset="50%" stop-color="#c9a574"/><stop offset="100%" stop-color="#b8915f"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bg)"/>
  <!-- easel legs -->
  <g stroke="#3a2c1c" stroke-width="14" stroke-linecap="round">
    <line x1="250" y1="150" x2="190" y2="540"/>
    <line x1="550" y1="150" x2="610" y2="540"/>
    <line x1="400" y1="300" x2="400" y2="545"/>
  </g>
  <!-- sign board -->
  <g transform="translate(400 290)">
    <rect x="-205" y="-225" width="410" height="450" rx="8" fill="#0a0c0f" opacity=".55" transform="translate(9 10)"/>
    <rect x="-205" y="-225" width="410" height="450" rx="8" fill="url(#birch)"/>
    <g stroke="#a9854f" stroke-width="1.5" opacity=".5" fill="none">
      <path d="M-205 -150 Q0 -160 205 -148"/><path d="M-205 -40 Q0 -50 205 -38"/>
      <path d="M-205 80 Q0 70 205 82"/><path d="M-205 180 Q0 172 205 182"/>
    </g>
    <!-- engraved artwork -->
    <g fill="#4a3017" text-anchor="middle">
      <text y="-150" font-family="Georgia" font-size="30" letter-spacing="8">WELCOME</text>
      <text y="-118" font-family="Georgia" font-size="15" letter-spacing="4">TO THE WEDDING OF</text>
      <text y="-30" font-family="Georgia" font-style="italic" font-size="58">Ava</text>
      <text y="35" font-family="Georgia" font-style="italic" font-size="34">&amp;</text>
      <text y="105" font-family="Georgia" font-style="italic" font-size="58">James</text>
      <text y="165" font-family="Georgia" font-size="17" letter-spacing="3">OCTOBER 17, 2026</text>
    </g>
    <!-- flourishes -->
    <g stroke="#4a3017" stroke-width="2.5" fill="none" stroke-linecap="round">
      <path d="M-120 -78 q40 -16 120 -12 q80 -4 120 12" opacity=".9"/>
      <path d="M-110 130 q50 14 110 10 q60 4 110 -10"/>
      <path d="M-150 -185 q10 12 0 22 M150 -185 q-10 12 0 22"/>
    </g>
  </g>
  <text x="400" y="575" text-anchor="middle" fill="#5a6270" font-family="Arial" font-size="14" letter-spacing="4">WEDDING WELCOME SIGN · 24 × 36</text>
</svg>
