<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="75%">
      <stop offset="0%" stop-color="#23272e"/><stop offset="100%" stop-color="#0d0f12"/>
    </radialGradient>
    <linearGradient id="acrylic" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1c2026"/><stop offset="50%" stop-color="#0e1115"/><stop offset="100%" stop-color="#22262d"/>
    </linearGradient>
    <linearGradient id="walnut" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6b4a2e"/><stop offset="100%" stop-color="#46301c"/>
    </linearGradient>
    <linearGradient id="goldtxt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f0d48a"/><stop offset="100%" stop-color="#c89b46"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bg)"/>
  <ellipse cx="400" cy="492" rx="270" ry="30" fill="#000" opacity=".45"/>
  <!-- acrylic peak -->
  <g transform="translate(400 270)">
    <path d="M0 -190 L150 150 L-150 150 Z" fill="url(#acrylic)"/>
    <path d="M0 -190 L150 150 L-150 150 Z" fill="none" stroke="#3a414c" stroke-width="3"/>
    <path d="M0 -178 L-138 144" stroke="#4a525e" stroke-width="2" opacity=".7"/>
    <path d="M0 -178 L138 144" stroke="#666f7c" stroke-width="3" opacity=".8"/>
    <!-- gold engraving -->
    <g text-anchor="middle" font-family="Georgia" fill="url(#goldtxt)">
      <path d="M-34 -60 L0 -94 L34 -60" stroke="url(#goldtxt)" stroke-width="4" fill="none" stroke-linecap="round"/>
      <text y="-18" font-size="21" letter-spacing="3">SUMMIT AWARD</text>
      <text y="22" font-size="26" font-style="italic">Avery K. Daniels</text>
      <text y="58" font-size="14" letter-spacing="2">TOP PERFORMER · 2026</text>
      <text y="92" font-size="12" letter-spacing="4" opacity=".8">MONTEGO CUSTOMS STUDIO</text>
    </g>
  </g>
  <!-- walnut base -->
  <rect x="215" y="420" width="370" height="46" rx="6" fill="url(#walnut)"/>
  <rect x="232" y="466" width="336" height="18" rx="4" fill="#36240f"/>
  <text x="400" y="560" text-anchor="middle" fill="#5a6270" font-family="Arial" font-size="14" letter-spacing="4">SUMMIT AWARD PLAQUE</text>
</svg>
