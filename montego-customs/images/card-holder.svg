<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="75%">
      <stop offset="0%" stop-color="#23272e"/><stop offset="100%" stop-color="#0d0f12"/>
    </radialGradient>
    <linearGradient id="walnut" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6b4a2e"/><stop offset="45%" stop-color="#54371f"/>
      <stop offset="60%" stop-color="#5e3f25"/><stop offset="100%" stop-color="#46301c"/>
    </linearGradient>
    <linearGradient id="walnutTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7d5836"/><stop offset="100%" stop-color="#5e3f25"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bg)"/>
  <ellipse cx="400" cy="470" rx="280" ry="36" fill="#000" opacity=".45"/>
  <!-- holder body -->
  <path d="M220 460 L580 460 L560 330 L240 330 Z" fill="url(#walnut)"/>
  <path d="M240 330 L560 330 L545 300 L255 300 Z" fill="url(#walnutTop)"/>
  <!-- card slot -->
  <path d="M268 318 L532 318 L526 306 L274 306 Z" fill="#1a120a"/>
  <!-- grain -->
  <g stroke="#3d2a17" stroke-width="2" opacity=".5" fill="none">
    <path d="M235 360 Q400 352 565 362"/><path d="M230 400 Q400 392 570 402"/>
    <path d="M225 440 Q400 430 575 442"/>
  </g>
  <!-- engraved logo -->
  <g transform="translate(400 398)">
    <polygon points="0,-44 38,-22 38,22 0,44 -38,22 -38,-22" stroke="#e8842c" stroke-width="4" fill="none" opacity=".95"/>
    <path d="M-19 18 V-14 l19 21 19-21 V18" stroke="#f3c08c" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <!-- business cards in slot -->
  <rect x="285" y="252" width="230" height="56" rx="3" fill="#e8e4dc" transform="rotate(-2 400 280)"/>
  <rect x="292" y="246" width="230" height="56" rx="3" fill="#d8d2c6" transform="rotate(-4 400 274)"/>
  <g transform="rotate(-2 400 280)" fill="#15181d" font-family="Arial" >
    <text x="305" y="280" font-size="15" font-weight="bold" letter-spacing="1">MONTEGO CUSTOMS</text>
    <text x="305" y="298" font-size="10" fill="#8b6f4e">PRECISION LASER ENGRAVING</text>
  </g>
  <text x="400" y="555" text-anchor="middle" fill="#5a6270" font-family="Arial" font-size="14" letter-spacing="4">WALNUT BUSINESS CARD HOLDER</text>
</svg>
